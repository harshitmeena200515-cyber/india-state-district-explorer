<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State & District Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }
        
        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            margin-top: 0;
            font-weight: 600;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #a855f7, #6366f1);
        
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 300;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 16px 24px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.5);
            color: white;
            font-size: 1.1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        button {
            padding: 16px 32px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        button:active {
            transform: scale(0.98);
        }

        #results {
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        #results::-webkit-scrollbar {
            width: 8px;
        }

        #results::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        #results::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .district-item {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            padding: 15px 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            animation: slideIn 0.4s ease forwards;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.2s ease;
        }
        
        .district-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px) !important;
            border-left-color: #a855f7;
        }

        .state-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .error-msg {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            text-align: center;
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Explore Districts</h1>
        <p class="subtitle">Discover districts by entering a state or union territory.</p>

        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="e.g. Maharashtra, Goa..." autocomplete="off">
            <button id="searchBtn">Search</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        let statesData = [];

        // Load JSON data
        fetch('states-and-districts.json')
            .then(response => response.json())
            .then(data => {
                statesData = data.states;
            })
            .catch(error => {
                console.error("Error loading JSON:", error);
                document.getElementById('results').innerHTML = `<div class="error-msg">Failed to load data. Make sure states-and-districts.json is present.</div>`;
            });

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsDiv = document.getElementById('results');

        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            resultsDiv.innerHTML = ''; // Clear previous

            if (!query) return;

            const foundState = statesData.find(s => s.state.toLowerCase() === query);

            if (foundState) {
                resultsDiv.innerHTML = `<div class="state-title">Districts in ${foundState.state} <span style="color:var(--text-muted); font-size: 1rem; font-weight:300;">(${foundState.districts.length})</span></div>`;
                
                foundState.districts.forEach((district, index) => {
                    const item = document.createElement('div');
                    item.className = 'district-item';
                    item.textContent = district;
                    item.style.animationDelay = `${index * 0.03}s`; // Staggered animation
                    resultsDiv.appendChild(item);
                });
            } else {
                resultsDiv.innerHTML = `<div class="error-msg">No state found matching "${searchInput.value}". Please check spelling.</div>`;
            }
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
